basePath: /
definitions:
  dto.CancelOrderRequest:
    properties:
      reason:
        type: string
    type: object
  dto.CancelOrderResponse:
    properties:
      order:
        $ref: '#/definitions/dto.Order'
    type: object
  dto.ConfirmEmailVerificationRequest:
    properties:
      code:
        type: string
    required:
    - code
    type: object
  dto.ConfirmPasswordResetRequest:
    properties:
      code:
        type: string
      new_password:
        minLength: 6
        type: string
    required:
    - code
    - new_password
    type: object
  dto.ConflictErrorResponse:
    properties:
      code:
        type: string
      details:
        type: string
      fields:
        items:
          $ref: '#/definitions/dto.FieldError'
        type: array
      message:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      code:
        type: string
      details:
        type: string
      fields:
        items:
          $ref: '#/definitions/dto.FieldError'
        type: array
      message:
        type: string
    type: object
  dto.FieldError:
    properties:
      field:
        type: string
      message:
        type: string
      tag:
        type: string
    type: object
  dto.ForbiddenErrorResponse:
    properties:
      code:
        type: string
      details:
        type: string
      fields:
        items:
          $ref: '#/definitions/dto.FieldError'
        type: array
      message:
        type: string
    type: object
  dto.GetOrderResponse:
    properties:
      order:
        $ref: '#/definitions/dto.Order'
    type: object
  dto.InternalErrorResponse:
    properties:
      code:
        type: string
      details:
        type: string
      fields:
        items:
          $ref: '#/definitions/dto.FieldError'
        type: array
      message:
        type: string
    type: object
  dto.ListOrdersResponse:
    properties:
      next_offset:
        type: integer
      orders:
        items:
          $ref: '#/definitions/dto.Order'
        type: array
      total:
        type: integer
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.LoginResponse:
    properties:
      role:
        type: string
      tokens:
        properties:
          access_expires_in:
            type: integer
          access_token:
            type: string
          refresh_expires_in:
            type: integer
          refresh_token:
            type: string
        type: object
      user_id:
        type: string
    type: object
  dto.LogoutRequest:
    properties:
      all:
        type: boolean
      refresh_token:
        type: string
    type: object
  dto.NotFoundErrorResponse:
    properties:
      code:
        type: string
      details:
        type: string
      fields:
        items:
          $ref: '#/definitions/dto.FieldError'
        type: array
      message:
        type: string
    type: object
  dto.Order:
    properties:
      cancel_reason:
        type: string
      created_at:
        type: string
      currency_code:
        type: string
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/dto.OrderItem'
        type: array
      status:
        type: string
      total_price_cents:
        type: integer
      updated_at:
        type: string
      user_id:
        type: string
    type: object
  dto.OrderItem:
    properties:
      currency_code:
        type: string
      line_total_cents:
        type: integer
      product_id:
        type: string
      quantity:
        type: integer
      unit_price_cents:
        type: integer
    type: object
  dto.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.RefreshResponse:
    properties:
      tokens:
        properties:
          access_expires_in:
            type: integer
          access_token:
            type: string
          refresh_expires_in:
            type: integer
          refresh_token:
            type: string
        type: object
    type: object
  dto.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  dto.RegisterResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      role:
        type: string
      user_id:
        type: string
    type: object
  dto.RequestPasswordResetRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.SuccessResponse:
    properties:
      message:
        type: string
    type: object
  dto.TooManyRequestsErrorResponse:
    properties:
      code:
        type: string
      details:
        type: string
      fields:
        items:
          $ref: '#/definitions/dto.FieldError'
        type: array
      message:
        type: string
    type: object
  dto.UnauthorizedErrorResponse:
    properties:
      code:
        type: string
      details:
        type: string
      fields:
        items:
          $ref: '#/definitions/dto.FieldError'
        type: array
      message:
        type: string
    type: object
  dto.ValidationErrorResponse:
    properties:
      code:
        type: string
      details:
        type: string
      fields:
        items:
          $ref: '#/definitions/dto.FieldError'
        type: array
      message:
        type: string
    type: object
info:
  contact: {}
  description: API для управления заказами
  title: OrderHub API
  version: "1.0"
paths:
  /admin/orders:
    get:
      consumes:
      - application/json
      description: Получает список заказов с возможностью фильтрации по пользователю
        и статусу
      parameters:
      - default: 20
        description: Количество заказов
        in: query
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        name: offset
        type: integer
      - description: UUID пользователя
        in: query
        name: user_id
        type: string
      - description: Статус заказа (PENDING, CONFIRMED, CANCELLED)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Список заказов
          schema:
            $ref: '#/definitions/dto.ListOrdersResponse'
        "400":
          description: Неверные параметры
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/dto.UnauthorizedErrorResponse'
        "403":
          description: Доступ запрещён
          schema:
            $ref: '#/definitions/dto.ForbiddenErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.InternalErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение списка заказов
      tags:
      - admin/orders
  /admin/orders/{order_id}:
    get:
      consumes:
      - application/json
      description: Получает детальную информацию о заказе по его ID
      parameters:
      - description: UUID заказа
        in: path
        name: order_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Информация о заказе
          schema:
            $ref: '#/definitions/dto.GetOrderResponse'
        "400":
          description: Неверный UUID
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/dto.UnauthorizedErrorResponse'
        "403":
          description: Доступ запрещён
          schema:
            $ref: '#/definitions/dto.ForbiddenErrorResponse'
        "404":
          description: Заказ не найден
          schema:
            $ref: '#/definitions/dto.NotFoundErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.InternalErrorResponse'
      security:
      - BearerAuth: []
      summary: Получение заказа по ID
      tags:
      - admin/orders
  /admin/orders/{order_id}/cancel:
    post:
      consumes:
      - application/json
      description: Отменяет заказ с указанием причины
      parameters:
      - description: UUID заказа
        in: path
        name: order_id
        required: true
        type: string
      - description: Причина отмены
        in: body
        name: cancel
        schema:
          $ref: '#/definitions/dto.CancelOrderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Отменённый заказ
          schema:
            $ref: '#/definitions/dto.CancelOrderResponse'
        "400":
          description: Неверный UUID
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/dto.UnauthorizedErrorResponse'
        "403":
          description: Доступ запрещён
          schema:
            $ref: '#/definitions/dto.ForbiddenErrorResponse'
        "404":
          description: Заказ не найден
          schema:
            $ref: '#/definitions/dto.NotFoundErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.InternalErrorResponse'
      security:
      - BearerAuth: []
      summary: Отмена заказа
      tags:
      - admin/orders
  /api/v1/auth/confirm-password-reset:
    post:
      consumes:
      - application/json
      description: Подтверждает сброс пароля для пользователя
      parameters:
      - description: Код подтверждения и новый пароль
        in: body
        name: code
        required: true
        schema:
          $ref: '#/definitions/dto.ConfirmPasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешное подтверждение сброса пароля
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/dto.ValidationErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/dto.NotFoundErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.InternalErrorResponse'
      summary: Подтверждение сброса пароля
      tags:
      - auth
  /api/v1/auth/email/verification/confirm:
    post:
      consumes:
      - application/json
      description: Подтверждает почту по одноразовому коду из письма
      parameters:
      - description: Код подтверждения
        in: body
        name: confirm
        required: true
        schema:
          $ref: '#/definitions/dto.ConfirmEmailVerificationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Email подтверждён
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Неверные данные или истёкший код
          schema:
            $ref: '#/definitions/dto.ValidationErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/dto.NotFoundErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.InternalErrorResponse'
      summary: Подтверждение email по коду
      tags:
      - auth
  /api/v1/auth/email/verification/request:
    post:
      description: Отправляет письмо подтверждения для текущего авторизованного пользователя
      produces:
      - application/json
      responses:
        "200":
          description: Письмо отправлено
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "401":
          description: Неавторизован
          schema:
            $ref: '#/definitions/dto.UnauthorizedErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/dto.NotFoundErrorResponse'
        "409":
          description: Email уже подтверждён
          schema:
            $ref: '#/definitions/dto.ConflictErrorResponse'
        "429":
          description: Слишком много запросов
          schema:
            $ref: '#/definitions/dto.TooManyRequestsErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.InternalErrorResponse'
      security:
      - BearerAuth: []
      summary: Повторная отправка письма подтверждения
      tags:
      - auth
  /api/v1/auth/jwks:
    get:
      description: Получает JSON Web Key Set (JWKS) для проверки подписи JWT
      responses: {}
      summary: Получение JWKS
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Авторизует пользователя и выдаёт пару токенов (access/refresh)
      parameters:
      - description: Данные авторизации
        in: body
        name: login
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.LoginResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/dto.ValidationErrorResponse'
        "401":
          description: Ошибка авторизации
          schema:
            $ref: '#/definitions/dto.UnauthorizedErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/dto.NotFoundErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.InternalErrorResponse'
      summary: Авторизация пользователя
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Логаут по refresh_token (single) или массовый логаут по all=true
      parameters:
      - description: Refresh token или all=true
        in: body
        name: logout
        required: true
        schema:
          $ref: '#/definitions/dto.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный логаут
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/dto.ValidationErrorResponse'
        "404":
          description: Токен не найден
          schema:
            $ref: '#/definitions/dto.NotFoundErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.InternalErrorResponse'
      security:
      - BearerAuth: []
      summary: Выход из системы
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Обновляет пару токенов по refresh токену
      parameters:
      - description: Данные для обновления токена
        in: body
        name: refresh
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.RefreshResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/dto.ValidationErrorResponse'
        "401":
          description: Ошибка авторизации
          schema:
            $ref: '#/definitions/dto.UnauthorizedErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.InternalErrorResponse'
      summary: Обновление токена
      tags:
      - auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Создаёт нового пользователя с ролью CUSTOMER
      parameters:
      - description: Данные регистрации
        in: body
        name: register
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешная регистрация
          schema:
            $ref: '#/definitions/dto.RegisterResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/dto.ValidationErrorResponse'
        "409":
          description: Пользователь уже существует
          schema:
            $ref: '#/definitions/dto.ConflictErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.InternalErrorResponse'
      summary: Регистрация пользователя
      tags:
      - auth
  /api/v1/auth/request-password-reset:
    post:
      consumes:
      - application/json
      description: Запрашивает сброс пароля для пользователя по почте
      parameters:
      - description: Email пользователя
        in: body
        name: email
        required: true
        schema:
          $ref: '#/definitions/dto.RequestPasswordResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Успешный запрос на сброс пароля
          schema:
            $ref: '#/definitions/dto.SuccessResponse'
        "400":
          description: Неверные данные
          schema:
            $ref: '#/definitions/dto.ValidationErrorResponse'
        "404":
          description: Пользователь не найден
          schema:
            $ref: '#/definitions/dto.NotFoundErrorResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/dto.InternalErrorResponse'
      summary: Запрос на сброс пароля
      tags:
      - auth
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
